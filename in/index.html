<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Generator Plugin</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: #262626;
            --border-color: #383838;
            --text-color: #e5e5e5;
            --text-muted: #a3a3a3;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --danger-color: #ef4444;
            --invoice-bg: #ffffff;
            --invoice-text: #1a1a1a;
            --table-header-bg: #dbe0e5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* App Layout */
        .app-container {
            display: flex;
            flex: 1;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Form Controls */
        .sidebar {
            width: 450px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            z-index: 10;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .sidebar-content {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .form-section {
            margin-bottom: 24px;
            background: rgba(0,0,0,0.15);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .form-section h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="date"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 8px 12px;
            background-color: #171717;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.85rem;
            font-family: inherit;
            transition: border-color 0.15s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            line-height: 1.4;
        }

        /* Item Repeater Styles */
        .repeater-item {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
            position: relative;
        }

        .repeater-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .btn-remove {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .btn-remove:hover {
            background-color: rgba(239, 68, 68, 0.1);
        }

        .btn-secondary {
            width: 100%;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: var(--text-muted);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            background-color: var(--panel-bg);
        }

        /* Preview Area */
        .preview-area {
            flex: 1;
            background-color: #121212;
            overflow-y: auto;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* PDF Document Layout */
        .pdf-page {
            width: 90%;
            max-width: 210mm;
            min-height: 297mm;
            height: 297mm;
            background-color: var(--invoice-bg);
            color: var(--invoice-text);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 40px;
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 12px;
            line-height: 1.4;
        }

        .pdf-header {
            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .invoice-title-block {
            text-align: right;
        }

        .invoice-title {
            font-size: 22px;
            font-weight: 400;
            color: #1a1a1a;
            margin-bottom: 6px;
        }

        .invoice-meta {
            font-size: 11px;
            color: #4b5563;
        }

        .invoice-meta div {
            margin-bottom: 2px;
        }

        /* Parties Grid (From / To) */
        .parties-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-top: 24px;
            margin-bottom: 32px;
        }

        .party-block h4 {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        .party-content {
            white-space: pre-line;
            color: #262626;
            font-size: 11px;
            line-height: 1.45;
        }

        /* Products Table */
        .products-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .products-table th {
            background-color: var(--table-header-bg);
            color: #374151;
            font-weight: 600;
            text-align: left;
            padding: 8px 12px;
            font-size: 11px;
        }

        .products-table th.text-center, .products-table td.text-center {
            text-align: center;
        }

        .products-table th.text-right, .products-table td.text-right {
            text-align: right;
        }

        .products-table td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 11px;
            color: #1a1a1a;
        }

        .products-table td.product-title {
            font-weight: 700;
        }

        /* Summary Container */
        .summary-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 32px;
        }

        .summary-box {
            width: 260px;
        }

        .summary-header {
            background-color: var(--table-header-bg);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            font-weight: 600;
            font-size: 11px;
            color: #374151;
        }

        .summary-header svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .summary-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }

        .summary-table td {
            padding: 4px 12px;
            font-size: 11px;
        }

        .summary-table tr.total-row td {
            font-weight: 700;
        }

        /* Footer Pagination */
        .pdf-footer {
            margin-top: auto;
            text-align: right;
            font-size: 10px;
            color: #6b7280;
            padding-top: 20px;
        }

        /* Print Override Rules */
        @media print {
            body {
                background: none;
            }
            .sidebar {
                display: none !important;
            }
            .preview-area {
                padding: 0;
                background: none;
                overflow: visible;
            }
            .pdf-page {
                width: 100% !important;
                max-width: none !important;
                box-shadow: none;
                height: 100vh;
                padding: 15mm;
                page-break-after: avoid;
                page-break-inside: avoid;
            }
            @page {
                size: A4;
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Controls -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Invoice Generator</h2>
            </div>

            <div class="sidebar-content">
                <!-- Meta Info -->
                <div class="form-section">
                    <h3>Invoice Details</h3>
                    <div class="form-group">
                        <label>Invoice Number</label>
                        <input type="text" id="inputNumber" value="0007">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Issued Date</label>
                            <input type="date" id="inputIssued" value="2026-10-22">
                        </div>
                        <div class="form-group">
                            <label>Due Date</label>
                            <input type="date" id="inputDue" value="2026-10-29">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Currency Symbol</label>
                        <input type="text" id="inputCurrency" value="€">
                    </div>
                </div>

                <!-- From & To Addresses -->
                <div class="form-section">
                    <h3>Parties</h3>
                    <div class="form-group">
                        <label>From (Sender)</label>
                        <textarea id="inputFrom">Razu Ahammad
Uttar Salna
1706 Gazipur
Bangladesh
razuahammad55@gmail.com
+8801721943423</textarea>
                    </div>
                    <div class="form-group">
                        <label>To (Recipient)</label>
                        <textarea id="inputTo">Stavrianou Pelagia Eleftheria
Marketing and Consultancy Services
Chatzikonstanti 22, Psichiko, 15452
Tax Number: EL125141664
Tax Office: KEFODE ATTIKIS
p-stavrianou@hotmail.com
Tel: +30 6979186608</textarea>
                    </div>
                </div>

                <!-- Products Repeater -->
                <div class="form-section">
                    <h3>Line Items</h3>
                    <div id="itemsContainer"></div>
                    <button type="button" class="btn-secondary" id="btnAddItem">+ Add Product Item</button>
                </div>

                <!-- Tax Setting -->
                <div class="form-section">
                    <h3>Tax Settings</h3>
                    <div class="form-group">
                        <label>Tax Amount</label>
                        <input type="number" id="inputTax" value="0.00" step="0.01">
                    </div>
                </div>
            </div>

            <div class="sidebar-footer">
                <button class="btn-primary" onclick="window.print()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 6 2 18 2 18 9"></polyline>
                        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                        <rect x="6" y="14" width="12" height="8"></rect>
                    </svg>
                    Print / Save PDF
                </button>
            </div>
        </div>

        <!-- Live Preview Area -->
        <div class="preview-area">
            <div class="pdf-page" id="pdfPage">
                <!-- Document Top Header -->
                <div>
                    <div class="pdf-header">
                        <div class="invoice-title-block">
                            <div class="invoice-title">Invoice: <span id="viewNumber">0007</span></div>
                            <div class="invoice-meta">
                                <div>Issued on: <span id="viewIssued">2026-10-22</span></div>
                                <div>Due by: <span id="viewDue">2026-10-29</span></div>
                            </div>
                        </div>
                    </div>

                    <!-- Sender / Recipient Section -->
                    <div class="parties-grid">
                        <div class="party-block">
                            <h4>From</h4>
                            <div class="party-content" id="viewFrom"></div>
                        </div>
                        <div class="party-block">
                            <h4>To</h4>
                            <div class="party-content" id="viewTo"></div>
                        </div>
                    </div>

                    <!-- Products Table -->
                    <table class="products-table">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th class="text-center">Quantity</th>
                                <th class="text-right">Unit Price</th>
                                <th class="text-center">Tax</th>
                                <th class="text-right">Total</th>
                            </tr>
                        </thead>
                        <tbody id="viewTableBody"></tbody>
                    </table>

                    <!-- Summary Box -->
                    <div class="summary-container">
                        <div class="summary-box">
                            <div class="summary-header">
                                <svg viewBox="0 0 24 24">
                                    <path d="M5 92h3v10H5zM10.5 5h3v14h-3zM16 12h3v7h-3z"/>
                                </svg>
                                <span>Invoice Summary</span>
                            </div>
                            <table class="summary-table">
                                <tr>
                                    <td>Subtotal</td>
                                    <td class="text-right" id="viewSubtotal">€ 0.00</td>
                                </tr>
                                <tr>
                                    <td>Tax</td>
                                    <td class="text-right" id="viewTax">€ 0.00</td>
                                </tr>
                                <tr class="total-row">
                                    <td>Total</td>
                                    <td class="text-right" id="viewTotal">€ 0.00</td>
                                </tr>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Footer Page Indicator -->
                <div class="pdf-footer">
                    1/1
                </div>
            </div>
        </div>
    </div>

    <script>
        // Default Line Items
        let items = [
            { id: 1, title: 'English to Italian Translation', quantity: 1, price: 200.00 }
        ];

        // Input References
        const inputNumber = document.getElementById('inputNumber');
        const inputIssued = document.getElementById('inputIssued');
        const inputDue = document.getElementById('inputDue');
        const inputCurrency = document.getElementById('inputCurrency');
        const inputFrom = document.getElementById('inputFrom');
        const inputTo = document.getElementById('inputTo');
        const inputTax = document.getElementById('inputTax');
        const itemsContainer = document.getElementById('itemsContainer');
        const btnAddItem = document.getElementById('btnAddItem');

        // View References
        const viewNumber = document.getElementById('viewNumber');
        const viewIssued = document.getElementById('viewIssued');
        const viewDue = document.getElementById('viewDue');
        const viewFrom = document.getElementById('viewFrom');
        const viewTo = document.getElementById('viewTo');
        const viewTableBody = document.getElementById('viewTableBody');
        const viewSubtotal = document.getElementById('viewSubtotal');
        const viewTax = document.getElementById('viewTax');
        const viewTotal = document.getElementById('viewTotal');

        // Bind Live Syncing
        inputNumber.addEventListener('input', e => viewNumber.textContent = e.target.value);
        inputIssued.addEventListener('input', e => viewIssued.textContent = e.target.value);
        inputDue.addEventListener('input', e => viewDue.textContent = e.target.value);
        inputFrom.addEventListener('input', e => viewFrom.textContent = e.target.value);
        inputTo.addEventListener('input', e => viewTo.textContent = e.target.value);
        
        inputCurrency.addEventListener('input', updateInvoice);
        inputTax.addEventListener('input', updateInvoice);

        // Render Repeater Controls in Sidebar
        function renderRepeater() {
            itemsContainer.innerHTML = '';
            items.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'repeater-item';
                itemDiv.innerHTML = `
                    <div class="repeater-item-header">
                        <span style="font-size:0.8rem; font-weight:600; color: var(--text-muted);">Item #${index + 1}</span>
                        ${items.length > 1 ? `<button type="button" class="btn-remove" onclick="removeItem(${item.id})">Remove</button>` : ''}
                    </div>
                    <div class="form-group">
                        <label>Product Name</label>
                        <input type="text" value="${item.title}" oninput="updateItem(${item.id}, 'title', this.value)">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Quantity</label>
                            <input type="number" value="${item.quantity}" min="1" oninput="updateItem(${item.id}, 'quantity', this.value)">
                        </div>
                        <div class="form-group">
                            <label>Unit Price</label>
                            <input type="number" value="${item.price}" step="0.01" oninput="updateItem(${item.id}, 'price', this.value)">
                        </div>
                    </div>
                `;
                itemsContainer.appendChild(itemDiv);
            });
        }

        // Add / Remove Repeater Methods
        btnAddItem.addEventListener('click', () => {
            items.push({
                id: Date.now(),
                title: 'New Product / Service',
                quantity: 1,
                price: 0.00
            });
            renderRepeater();
            updateInvoice();
        });

        window.removeItem = function(id) {
            items = items.filter(item => item.id !== id);
            renderRepeater();
            updateInvoice();
        };

        window.updateItem = function(id, key, value) {
            const item = items.find(i => i.id === id);
            if (item) {
                item[key] = key === 'title' ? value : parseFloat(value) || 0;
                updateInvoice();
            }
        };

        // Calculate and Render Live Document
        function updateInvoice() {
            const currency = inputCurrency.value || '€';
            let subtotal = 0;

            viewTableBody.innerHTML = '';

            items.forEach(item => {
                const total = item.quantity * item.price;
                subtotal += total;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="product-title">${item.title}</td>
                    <td class="text-center">${item.quantity}</td>
                    <td class="text-right">${currency} ${item.price.toFixed(2)}</td>
                    <td class="text-center"></td>
                    <td class="text-right">${currency} ${total.toFixed(2)}</td>
                `;
                viewTableBody.appendChild(tr);
            });

            const taxVal = parseFloat(inputTax.value) || 0;
            const grandTotal = subtotal + taxVal;

            viewSubtotal.textContent = `${currency} ${subtotal.toFixed(2)}`;
            viewTax.textContent = `${currency} ${taxVal.toFixed(2)}`;
            viewTotal.textContent = `${currency} ${grandTotal.toFixed(2)}`;
        }

        // Initialize First View
        function init() {
            viewFrom.textContent = inputFrom.value;
            viewTo.textContent = inputTo.value;
            renderRepeater();
            updateInvoice();
        }

        init();
    </script>
</body>
</html>
